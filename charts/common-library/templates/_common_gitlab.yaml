# Start tasks post `running` (GitLab has a true in-progress state, and it also
# avoids the pending -> pending transition GitLab rejects when the queue
# interceptor has already posted a pending/QUEUED status in the same context).
# The init section for gitlab build pipeline
{{- define "gitlab-build-start" -}}
- name: fetch-repository
  taskRef:
    kind: Task
    name: git-clone
  params:
    - name: url
      value: $(params.git-source-url)
    - name: revision
      value: $(params.git-source-revision)
    - name: subdirectory
      value: source
  workspaces:
    - name: output
      workspace: shared-workspace
    - name: ssh-directory
      workspace: ssh-creds

# Votes on the commit the clone actually checked out: consuming the clone's
# `commit` result both orders this task after fetch-repository and skips it
# structurally when no commit was cloned - no when-guard needed.
- name: report-pipeline-start-to-gitlab
  taskRef:
    kind: Task
    name: gitlab-set-status
  params:
    - name: "STATE"
      value: "running"
    - name: "GITLAB_HOST_URL"
      value: "$(params.git-source-url)"
    - name: "REPO_FULL_NAME"
      value: "$(params.gitfullrepositoryname)"
    - name: "GITLAB_TOKEN_SECRET_NAME"
      value: ci-gitlab
    - name: "GITLAB_TOKEN_SECRET_KEY"
      value: token
    - name: "SHA"
      value: "$(tasks.fetch-repository.results.commit)"
    - name: "TARGET_URL"
      value: $(params.pipelineUrl)
    - name: "CONTEXT"
      value: "Build Pipeline"
    - name: "DESCRIPTION"
      value: "IN PROGRESS"

- name: init-values
  taskRef:
    kind: Task
    name: init-values
  runAfter:
    - fetch-repository
  params:
    - name: CODEBASE_NAME
      value: $(params.CODEBASE_NAME)
    - name: BRANCH_NAME
      value: $(params.git-source-revision)
{{- end -}}

# The init section for gitlab code-review pipeline
{{- define "gitlab-review-start" -}}
- name: report-pipeline-start-to-gitlab
  taskRef:
    kind: Task
    name: gitlab-set-status
  params:
    - name: "STATE"
      value: "running"
    - name: "GITLAB_HOST_URL"
      value: "$(params.git-source-url)"
    - name: "REPO_FULL_NAME"
      value: "$(params.gitfullrepositoryname)"
    - name: "GITLAB_TOKEN_SECRET_NAME"
      value: ci-gitlab
    - name: "GITLAB_TOKEN_SECRET_KEY"
      value: token
    - name: "SHA"
      value: "$(params.git-source-revision)"
    - name: "TARGET_URL"
      value: $(params.pipelineUrl)
    - name: "CONTEXT"
      value: "Review Pipeline"
    - name: "DESCRIPTION"
      value: "IN PROGRESS"

- name: fetch-repository
  taskRef:
    kind: Task
    name: git-clone
  runAfter:
    - report-pipeline-start-to-gitlab
  params:
    - name: url
      value: $(params.git-source-url)
    - name: revision
      value: $(params.git-source-revision)
    - name: refspec
      value: $(params.git-refspec)
    - name: subdirectory
      value: source
  workspaces:
    - name: output
      workspace: shared-workspace
    - name: ssh-directory
      workspace: ssh-creds

- name: init-values
  taskRef:
    kind: Task
    name: init-values
  runAfter:
    - fetch-repository
  params:
    - name: CODEBASE_NAME
      value: $(params.CODEBASE_NAME)
    - name: BRANCH_NAME
      value: $(params.git-source-revision)
{{- end -}}


# final section for gitlab codereview pipelines
{{- define "gitlab-review-vote" -}}
finally:
  # A single unguarded reporter: the task derives the commit state from the
  # aggregate $(tasks.status) (success, failure, or cancellation - caught
  # mid-task or landed between tasks), so every terminal shape is reported and
  # no when-guard gap can leave the check stuck on a non-terminal state.
  - name: gitlab-report-pipeline-status
    taskRef:
      kind: Task
      name: gitlab-set-status
    params:
      - name: "PIPELINE_STATUS"
        value: "$(tasks.status)"
      - name: "GITLAB_HOST_URL"
        value: "$(params.git-source-url)"
      - name: "REPO_FULL_NAME"
        value: "$(params.gitfullrepositoryname)"
      - name: "GITLAB_TOKEN_SECRET_NAME"
        value: ci-gitlab
      - name: "GITLAB_TOKEN_SECRET_KEY"
        value: token
      - name: "SHA"
        value: "$(params.git-source-revision)"
      - name: "TARGET_URL"
        value: $(params.pipelineUrl)
      - name: "CONTEXT"
        value: "Review Pipeline"
{{- end -}}


{{- define "gitlab-build-vote" -}}
- name: gitlab-report-pipeline-status
  taskRef:
    kind: Task
    name: gitlab-set-status
  params:
    - name: "PIPELINE_STATUS"
