{{- if eq .Values.interceptor.enabled true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-edp-interceptor
  labels:
    {{- include "edp-tekton-interceptor.labels" . | nindent 4 }}
rules:
  - verbs:
      - get
      - list
      - watch
      - update
    apiGroups:
      - triggers.tekton.dev
    resources:
      - interceptors

  - verbs:
      - get
      - list
      - watch
      - update
      - create
    apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - tekton-edp-interceptor-certs

  # The git server token is read by name: the interceptor resolves a Codebase to
  # its GitServer and reads GitServer.spec.nameSshKeySecret. The rule is omitted
  # entirely when no name is known, because an empty resourceNames grants every
  # secret in the namespace rather than none. A GitServer created with a custom
  # nameSshKeySecret must be listed in interceptor.extraSecretNames.
{{- $gitServerSecrets := include "edp-tekton-interceptor.gitServerSecretNames" . | fromJsonArray }}
{{- if $gitServerSecrets }}
  - verbs:
      - get
    apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      {{- range $gitServerSecrets }}
      - {{ . | quote }}
      {{- end }}
{{- end }}

  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - v2.edp.epam.com
    resources:
      - codebases
      - codebases/status
      - codebases/finalizers

  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - v2.edp.epam.com
    resources:
      - codebasebranches
      - codebasebranches/status
      - codebasebranches/finalizers

  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - v2.edp.epam.com
    resources:
      - gitservers
      - gitservers/status
      - gitservers/finalizers

{{- if .Values.pipelines.cancelInProgress }}
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
{{- end }}
{{- end }}
