{{- if eq .Values.interceptor.enabled true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-edp-interceptor
  labels:
    {{- include "edp-tekton-interceptor.labels" . | nindent 4 }}
rules:
  # At startup the interceptor reads its own Interceptor registration and
  # writes the generated CA bundle into spec.clientConfig.caBundle.
  - verbs:
      - get
      - update
    apiGroups:
      - triggers.tekton.dev
    resources:
      - interceptors

  # Startup-only: populate the chart-created serving-cert secret. No `create`:
  # RBAC cannot name-scope create requests, so the verb here never authorized
  # anything, and the chart ships the (empty) secret so the create path in the
  # binary is never taken under a Helm install.
  - verbs:
      - get
      - update
    apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - tekton-edp-interceptor-certs

  # Dropped rather than emitted empty: an empty resourceNames grants every
  # secret in the namespace, not none.
{{- $gitServerSecrets := include "edp-tekton-interceptor.secretNames" . | fromJsonArray }}
{{- if $gitServerSecrets }}
  - verbs:
      - get
    apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      {{- range $gitServerSecrets }}
      - {{ . | quote }}
      {{- end }}
{{- end }}

  # Webhook enrichment: codebases and branches are selected by label (list);
  # codebases fall back to a full list-and-scan while codebases without the
  # gitUrlPathHash label exist. Git servers are fetched by name. Plain reads
  # return spec and status inline, so no subresource grants are needed, and
  # the binary opens no watches (direct client, no informer cache).
  - verbs:
      - get
      - list
    apiGroups:
      - v2.edp.epam.com
    resources:
      - codebases
      - codebasebranches
      - gitservers

  # ServiceAccount discovery: read the app.edp.epam.com/service-account
  # annotation from the Pipeline resolved for the event
  - verbs:
      - get
    apiGroups:
      - tekton.dev
    resources:
      - pipelines

{{- if .Values.pipelines.cancelInProgress }}
  # Cancel-in-progress lists sibling runs by label and merge-patches them
  # to Cancelled
  - verbs:
      - list
      - patch
    apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
{{- end }}
{{- end }}
