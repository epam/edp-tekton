{{ if has "github" .Values.global.gitProviders }}
{{ if .Values.pipelines.deployableResources.docker }}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: github-kaniko-docker-lib-build-default
  annotations:
    app.edp.epam.com/service-account: tekton
  labels:
    app.edp.epam.com/pipelinetype: build
    app.edp.epam.com/triggertemplate: github-build-template
    {{- include "edp-tekton.labels" . | nindent 4 }}
spec:
  description: "The Build pipeline for building Docker application (default versioning)"
  workspaces:
    - name: shared-workspace
    - name: ssh-creds
  params:
    {{- include "edp-tekton.pipelineUrlParam" $ | nindent 4 }}
    - name: git-source-url
      default: "https://github.com/epmd-edp/container-kaniko-docker"
      description: git url to clone
      type: string
    - name: git-source-revision
      description: 'git revision to checkout (branch, tag, sha, ref…)'
      default: "edp"
      type: string
    - name: CODEBASE_NAME
      default: 'docker-kaniko'
      description: "Project name"
      type: string
    - name: CODEBASEBRANCH_NAME
      description: "Codebasebranch name"
      type: string
    - name: changeNumber
      description: Change number from Merge Request
      default: ""
      type: string
    - name: gitfullrepositoryname
      description: "repository full name"
      type: string
    - name: COMMIT_MESSAGE
      description: "Commit message"
      default: ""

{{- include "build-result" . | nindent 2 }}

  tasks:

{{- include "github-build-start" . | nindent 4 }}

    - name: get-version
      taskRef:
        kind: Task
        name: get-version-default
      runAfter:
        - init-values
      params:
        - name: BRANCH_NAME
          value: $(params.git-source-revision)


    - name: dockerfile-lint
      taskRef:
        kind: Task
        name: hadolint
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-workspace
          subPath: source

{{- include "build-pipeline-docker-image-build-push-common" $ | nindent 4 }}

{{ include "build-pipeline-end" . | nindent 4 }}

  finally:

{{ include "github-build-vote" . | nindent 4 }}

{{ end }}
{{ end }}
