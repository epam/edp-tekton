{{ if has "github" .Values.global.gitProviders }}
{{ if .Values.pipelines.deployableResources.python.ansible }}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: github-python-ansible-lib-build-default
  annotations:
    app.edp.epam.com/service-account: tekton
  labels:
    app.edp.epam.com/pipelinetype: build
    app.edp.epam.com/triggertemplate: github-build-template
    {{- include "edp-tekton.labels" . | nindent 4 }}
spec:
  description: "The Build pipeline for building Ansible library (default versioning)"
  workspaces:
    - name: shared-workspace
    - name: ssh-creds
  params:
    {{- include "edp-tekton.pipelineUrlParam" $ | nindent 4 }}
    - name: git-source-url
      default: "https://github.com/epmd-edp/python-python-ansible"
      description: git url to clone
      type: string
    - name: git-source-revision
      description: 'git revision to checkout (branch, tag, sha, ref…)'
      default: "master"
      type: string
    - name: CODEBASE_NAME
      default: 'ansible'
      description: "Project name"
      type: string
    - name: changeNumber
      description: Change number from Merge Request
      default: ""
      type: string
    - name: gitfullrepositoryname
      description: "repository full name"
      type: string
    - name: COMMIT_MESSAGE
      description: "Commit message"
      default: ""

{{- include "build-result" . | nindent 2 }}

  tasks:

{{- include "github-build-start" . | nindent 4 }}

    - name: get-version
      taskRef:
        kind: Task
        name: get-version-default
      runAfter:
        - init-values
      params:
        - name: BRANCH_NAME
          value: $(params.git-source-revision)

{{- include "ansible-check-build-common" . | nindent 4 }}

  finally:

{{ include "github-build-vote" . | nindent 4 }}

{{ end }}
{{ end }}
