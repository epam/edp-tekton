{{- if eq .Values.reporter.enabled true }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "edp-tekton-reporter.name" . }}
  labels:
    {{- include "edp-tekton-reporter.labels" . | nindent 4 }}
rules:
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - tekton.dev
    resources:
      - pipelineruns

  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - tekton.dev
    resources:
      - taskruns

{{- if .Values.reporter.logsReporting }}
  - verbs:
      - get
    apiGroups:
      - ''
    resources:
      - pods/log
{{- end }}

  # Dropped rather than emitted empty: an empty resourceNames grants every
  # secret in the namespace, not none.
{{- $reporterSecrets := include "edp-tekton-reporter.secretNames" . | fromJsonArray }}
{{- if $reporterSecrets }}
  - verbs:
      - get
    apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      {{- range $reporterSecrets }}
      - {{ . | quote }}
      {{- end }}
{{- end }}

  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - v2.edp.epam.com
    resources:
      - codebases
      - codebases/status
      - codebases/finalizers

  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - v2.edp.epam.com
    resources:
      - gitservers
      - gitservers/status
      - gitservers/finalizers

  # Leader election.
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - coordination.k8s.io
    resources:
      - leases

  - verbs:
      - create
      - patch
    apiGroups:
      - ''
    resources:
      - events
{{- end }}
