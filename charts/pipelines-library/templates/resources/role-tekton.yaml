apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
  name: tekton-pipeline-role
rules:
  # named reads of the CRs pipeline params reference (promote-images,
  # init-autotests, get-version)
  - apiGroups:
      - 'v2.edp.epam.com'
    resources:
      - cdpipelines
      - codebasebranches
      - codebases
    verbs:
      - get

  # get-version and update-cbb record build results on the branch status;
  # kubectl patch --subresource=status GETs the subresource before patching
  - apiGroups:
      - 'v2.edp.epam.com'
    resources:
      - codebasebranches/status
    verbs:
      - get
      - patch

  # update-cbis resolves the stream by codebasebranch label, then appends tags
  - apiGroups:
      - 'v2.edp.epam.com'
    resources:
      - codebaseimagestreams
    verbs:
      - get
      - list
      - patch

  # promote-images annotates the stage with the promoted image tags
  - apiGroups:
      - 'v2.edp.epam.com'
    resources:
      - stages
    verbs:
      - get
      - patch

  # deploy tasks read the ApplicationSet and merge-patch new image tags into it
  - verbs:
      - get
      - patch
    apiGroups:
      - argoproj.io
    resources:
      - applicationsets

{{- if .Values.pipelines.argocdDiffPreview.enabled }}
  # the gitops review diff preview exports the Applications affected by an MR
  # (resolved by name from the changed GitOps file paths) to render the diff
  - verbs:
      - get
    apiGroups:
      - argoproj.io
    resources:
      - applications
{{- end }}
