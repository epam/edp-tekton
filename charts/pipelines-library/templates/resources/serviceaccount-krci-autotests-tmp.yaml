{{- if .Values.pipelines.autotestsServiceAccount.enabled }}
{{- /*
Temporary account for the PipelineRuns the test automation framework creates.

The framework builds PipelineRuns directly instead of going through EventListener and
TriggerTemplate, so the account the interceptor resolves per pipeline never reaches it and it
has to name one itself. A single suite starts build and deploy pipelines in the same run, so
until the framework resolves the account the same way the trigger path does, those runs need
one account that covers both.

The rules are the union of tekton-pipeline-role, tekton-cd and tekton-security and nothing
beyond them. In particular there is no secrets rule and no configmaps rule: the framework
reads its credentials from a projected volume, and no pipeline task reads either through the
Kubernetes API.

Remove this file together with the constant in the framework.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krci-autotests-tmp
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
  {{- if .Values.kaniko.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.kaniko.roleArn }}
  {{- end }}
# Mirrors the tekton account: build pipelines push images with the same credentials.
{{- if ne .Values.global.dockerRegistry.type "ecr" }}
secrets:
- name: kaniko-docker-config
{{- end }}
{{- with .Values.pipelines.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krci-autotests-tmp
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
rules:
  # get-version reads the branch version and release flag
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - codebasebranches
    verbs:
      - get
  # get-version and update-cbb record build results on the branch status;
  # kubectl patch --subresource=status GETs the subresource before patching
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - codebasebranches/status
    verbs:
      - get
      - patch
  # update-cbis resolves the stream by codebasebranch label and appends tags;
  # promote-images appends to the next stage's stream
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - codebaseimagestreams
    verbs:
      - get
      - list
      - patch
  # promote-images reads the deployment flow and annotates the stage with promoted tags
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - cdpipelines
    verbs:
      - get
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - stages
    verbs:
      - get
      - patch
  # init-autotests resolves quality gates from the stage, then the autotest codebases
  # and their git servers by name
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - codebases
      - gitservers
    verbs:
      - get
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
  # deploy tasks read the ApplicationSet and merge-patch new image tags into it
  - apiGroups:
      - argoproj.io
    resources:
      - applicationsets
    verbs:
      - get
      - patch
  # init-autotests starts autotest pipelines with `tkn pipeline start`, which reads the
  # Pipeline and creates a PipelineRun; wait-for-autotests polls the run
  - apiGroups:
      - tekton.dev
    resources:
      - pipelines
    verbs:
      - get
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krci-autotests-tmp
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: krci-autotests-tmp
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krci-autotests-tmp
{{- end }}
