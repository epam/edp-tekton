apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-cd
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
{{- with .Values.pipelines.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-cd
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
rules:
  # promote-images reads the deployment flow and annotates the stage with
  # promoted image tags
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - cdpipelines
    verbs:
      - get
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - stages
    verbs:
      - get
      - patch
  # promote-images appends tags to the verified image stream
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - codebaseimagestreams
    verbs:
      - get
      - patch
  # init-autotests resolves quality gates from the stage, then the autotest
  # codebases and their git servers by name
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - codebases
      - gitservers
    verbs:
      - get
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
  # deploy tasks read the ApplicationSet and merge-patch new image tags into it
  - apiGroups:
      - argoproj.io
    resources:
      - applicationsets
    verbs:
      - get
      - patch
  # init-autotests starts autotest pipelines with `tkn pipeline start`, which
  # reads the Pipeline and creates a PipelineRun; wait-for-autotests polls the run
  - apiGroups:
      - tekton.dev
    resources:
      - pipelines
    verbs:
      - get
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-cd
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: tekton-cd
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-cd
