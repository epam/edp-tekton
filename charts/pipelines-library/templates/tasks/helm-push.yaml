{{ if .Values.pipelines.deployableResources.tasks }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: helm-push
spec:
  description: >-
   This task pushes a new version of a Helm chart to a container registry, supporting both ECR and other registry types, and includes handling for different platforms and registry configurations.
  workspaces:
    - name: source
      description: A workspace that contains the repository.
  volumes:
    - name: dockerconfig
      secret:
        secretName: kaniko-docker-config
        items:
          - key: .dockerconfigjson
            path: config.json
        optional: true
    - name: ecr-token
      emptyDir: {}
  params:
    - name: image-tag
      description: Image tag
    - name: chart-dir
      description: The directory in source that contains the helm chart
      default: "."
  steps:
    - name: init-repository
      image: {{ include "edp-tekton.registry" . }}/amazon/aws-cli:2.7.35
      workingDir: $(workspaces.source.path)
      env:
        - name: AWS_DEFAULT_REGION
          valueFrom:
            configMapKeyRef:
              name: krci-config
              key: aws_region
              optional: true
        - name: CHART_DIR
          value: $(params.chart-dir)
        - name: CONTAINER_REGISTRY_SPACE
          valueFrom:
            configMapKeyRef:
              name: krci-config
              key: container_registry_space
        - name: CONTAINER_REGISTRY_TYPE
          valueFrom:
            configMapKeyRef:
              name: krci-config
              key: container_registry_type
      volumeMounts:
        - mountPath: /ecr
          name: ecr-token
      script: |
          if [[ "$CONTAINER_REGISTRY_TYPE" == "ecr" ]]; then
            REPO_NAME=$(awk '/^name:/ {print $2}' ${CHART_DIR}/Chart.yaml)
            aws ecr describe-repositories --repository-names "${CONTAINER_REGISTRY_SPACE}/${REPO_NAME}" || aws ecr create-repository --repository-name "${CONTAINER_REGISTRY_SPACE}/${REPO_NAME}";

            set +x
            umask 077
            aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" > /ecr/token
            if [ ! -s /ecr/token ]; then
              echo '[ERROR] Failed to obtain an ECR login token';
              exit 1;
            fi
            echo 'ECR login token stored for the push step';
          else
            echo 'Registry not ECR, stage skipped';
          fi

    - name: push-helm-chart
      image: {{ include "edp-tekton.registry" . }}/epamedp/kubectl:0.1.2
      workingDir: $(workspaces.source.path)
      env:
        - name: IMAGE_TAG
          value: "$(params.image-tag)"
        - name: CHART_DIR
          value: $(params.chart-dir)
        - name: CONTAINER_REGISTRY_TYPE
          valueFrom:
            configMapKeyRef:
              name: krci-config
              key: container_registry_type
        - name: CONTAINER_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              name: krci-config
              key: container_registry_host
        - name: CONTAINER_REGISTRY_SPACE
          valueFrom:
            configMapKeyRef:
              name: krci-config
              key: container_registry_space
        - name: PLATFORM
          valueFrom:
            configMapKeyRef:
              key: platform
              name: krci-config
      script: |
        #!/usr/bin/env sh

        set -ex

        helm package ${CHART_DIR} --version ${IMAGE_TAG}

        helm_push_command="helm push *-${IMAGE_TAG}.tgz oci://${CONTAINER_REGISTRY_URL}/${CONTAINER_REGISTRY_SPACE}"


        if [ "$CONTAINER_REGISTRY_TYPE" != "ecr" ]; then
          helm_push_command="${helm_push_command} --registry-config /.config/helm/registry/config.json"
        fi

        if [ "$PLATFORM" = "openshift" ]; then
          helm_push_command="${helm_push_command} --insecure-skip-tls-verify"
        fi

        if [ "$CONTAINER_REGISTRY_TYPE" = "ecr" ]; then
          set +x
          helm registry login --username AWS --password-stdin ${CONTAINER_REGISTRY_URL} < /ecr/token
          set -x
        fi

        $helm_push_command

      # Adding this securityContext makes it explicit that it needs to run as root.
      # Required for Openshift.
      securityContext:
        runAsUser: 0
      # This secret mount is necessary for helm push to internal openshift registry
      volumeMounts:
        - mountPath: /.config/helm/registry
          name: dockerconfig
        - mountPath: /ecr
          name: ecr-token
{{- include "resources" . | nindent 6 }}
{{ end }}
