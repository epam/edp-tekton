{{ if .Values.pipelines.deployableResources.tasks }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: save-cache
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Build Tools
    tekton.dev/tags: build-tool
    tekton.dev/displayName: "save-cache"
    tekton.dev/platforms: "linux/amd64,linux/s390x,linux/ppc64le"
spec:
  description: >-
    This Task is used to save the cache to the distribution server. It packs and uploads the root of workspace to the distribution server
  workspaces:
    - name: cache
  params:
    - name: CACHE_NAME
      description: "Cache name (filename) to be downloaded from the cache server."
      type: string
    - name: BASE_IMAGE
      description: "Base image"
      default: "{{ include "edp-tekton.registry" . }}/epamedp/tekton-autotest:0.1.8"
      type: string
    - name: CACHE_MAX_AGE_DAYS
      description: "Maximum age (in days) of the existing cache archive before it is considered stale and re-uploaded. Set to 0 to always upload."
      default: "1"
      type: string
  steps:
    - name: save-cache
      image: $(params.BASE_IMAGE)
      workingDir: $(workspaces.cache.path)

      script: |
        #!/usr/bin/env bash
        set -ex

        curl -o/dev/null -s -f -X POST -F path=test -F file=@/etc/motd  ${CACHE_SERVER_URL}/upload || {
            echo "No cache server found"
            exit 0
        }

        lm="$(curl -fsI ${CACHE_SERVER_URL}/${CACHE_NAME}.tar.zst|sed -n '/Last-Modified/ { s/Last-Modified: //;s/\r//; p}')"
        if [ -n "${lm}" ] && [ "${CACHE_MAX_AGE_DAYS}" != "0" ]; then
          expired=$(python -c "import datetime, sys;print(datetime.datetime.now() > datetime.datetime.strptime(sys.argv[1], '%a, %d %b %Y %X %Z') + datetime.timedelta(days=int(sys.argv[2])))" "${lm}" "${CACHE_MAX_AGE_DAYS}")
          if [ "${expired}" = "False" ]; then
              echo "Cache is younger than ${CACHE_MAX_AGE_DAYS} day(s)"
              exit
          fi
        fi

        tar c \
          -I "zstd -T1 -1" \
          -f /tmp/${CACHE_NAME}.tar.zst \
          .

        curl \
          -# \
          -L \
          -f \
          -F path=${CACHE_NAME}.tar.zst \
          -X POST \
          -F "file=@/tmp/${CACHE_NAME}.tar.zst" \
          ${CACHE_SERVER_URL}/upload
      env:
        - name: CACHE_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: tekton-cache
              key: url
              optional: true
        - name: CACHE_NAME
          value: "$(params.CACHE_NAME)"
        - name: CACHE_MAX_AGE_DAYS
          value: "$(params.CACHE_MAX_AGE_DAYS)"

      computeResources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 1Gi
{{ end }}
