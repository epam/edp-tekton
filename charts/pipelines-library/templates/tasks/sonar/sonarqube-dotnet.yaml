{{ if .Values.pipelines.deployableResources.tasks }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sonarqube-dotnet
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Security
    tekton.dev/tags: security
    tekton.dev/displayName: "sonarqube scanner"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    The sonarqube-scanner Task will update parameters in the
    sonar-project.properties file or create a new sonar-project.properties
    file and put parameters of a sonar project into it.

    Task will run sonar-scanner for scanning after preparing the sonar-project.properties file.

  workspaces:
    - name: source
  params:
    - name: SONAR_PROJECT_KEY
      description: Project's unique key
      default: ""
    - name: SONAR_PROJECT_NAME
      description: Project's unique name
      default: ""
    - name: SONAR_QUALITYGATE_WAIT
      description: Forces the analysis step to poll the SonarQube instance and wait for the Quality Gate status.
      default: "true"
    - name: ci-sonarqube
      type: string
      description: name of the secret holding the Sonarqube CI integration data
      default: "ci-sonarqube"
    - name: branch
      type: string
      description: Branch of scanning (for build pipeline)
      default: ""
    - name: target-branch
      type: string
      description: Target branch of Merge Request
      default: ""
    - name: source-branch
      type: string
      description: Source branch of Merge Request
      default: ""
    - name: key-id
      type: string
      description: Change number from Merge Request
      default: ""
    - name: BASE_IMAGE
      description: DotNet base image.
      type: string
      default: "{{ include "edp-tekton.registry" . }}/epamedp/tekton-dotnet:6.0.3"
    - name: PROJECT_DIR
      description: The directory containing build.gradle
      type: string
      default: "."
    - name: EXTRA_COMMANDS
      type: string
    - name: step_prepare_project_image
      type: string
      default: "{{ include "edp-tekton.registry" . }}/epamedp/tekton-autotest:0.1.8"
  steps:
    - image: $(params.step_prepare_project_image)
      name: prepare-project
      workingDir: $(workspaces.source.path)
      env:
{{- include "edp-tekton.sonar.secretEnv" . | nindent 8 }}
        - name: SONAR_PROJECT_KEY
          value: "$(params.SONAR_PROJECT_KEY)"
        - name: SONAR_PROJECT_NAME
          value: "$(params.SONAR_PROJECT_NAME)"
      script: |
        {{ include "edp-tekton.sonar.prepareProject" . | nindent 8 }}
    - name: sonar-scanner
      image: $(params.BASE_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.PROJECT_DIR)
      env:
        - name: HOME
          value: $(workspaces.source.path)
{{- include "edp-tekton.sonar.secretEnv" . | nindent 8 }}
        - name: SONAR_PROJECT_KEY
          value: "$(params.SONAR_PROJECT_KEY)"
        - name: SONAR_PROJECT_NAME
          value: "$(params.SONAR_PROJECT_NAME)"
        - name: SONAR_QUALITYGATE_WAIT
          value: "$(params.SONAR_QUALITYGATE_WAIT)"
        - name: TARGET_BRANCH
          value: "$(params.target-branch)"
        - name: SOURCE_BRANCH
          value: "$(params.source-branch)"
        - name: KEY_ID
          value: "$(params.key-id)"
        - name: BRANCH
          value: "$(params.branch)"
      script: |
        #!/usr/bin/env sh
        set -e

{{ include "edp-tekton.sonar.resolve" . | nindent 8 }}

        if [ "${SONAR_MODE}" = "sonarcloud" ]; then
          # 'dotnet sonarscanner begin' takes the project key and the organization only as /k: and /o:
          # arguments, so there is no project-level place for them. They are read from
          # SonarQube.Analysis.xml, the settings file of the SonarScanner for .NET, in the repository
          # root. sonar-project.properties is not used: the scanner refuses to run when it exists.
          SETTINGS="$(workspaces.source.path)/SonarQube.Analysis.xml"
          xml_property() {
            [ -f "${SETTINGS}" ] || return 0
            tr '\r\n' '  ' < "${SETTINGS}" | sed -n "s|.*<Property[^>]*Name=\"$1\"[^>]*>[[:space:]]*\([^<]*[^<[:space:]]\)[[:space:]]*</Property>.*|\1|p"
          }
          SONAR_KEY=$(xml_property sonar.projectKey)
          SONAR_ORG=$(xml_property sonar.organization)
          if [ -z "${SONAR_KEY}" ] || [ -z "${SONAR_ORG}" ]; then
            echo "ERROR: SonarCloud requires the sonar.projectKey and sonar.organization properties in SonarQube.Analysis.xml in the repository root."
            exit 1
          fi

          # The pipeline passes /k:${SONAR_PROJECT_KEY}: the key of the project replaces the codebase name.
          SONAR_PROJECT_KEY="${SONAR_KEY}"
          export SONAR_PROJECT_KEY

          # In the US region the scanner needs /d:sonar.region and must not get sonar.host.url.
          if [ -n "${SONAR_REGION}" ]; then
            unset SONAR_HOST_URL
          fi

          # A wrapper adds /o: (and the region) to 'begin' and drops the host URL in the US region.
          REAL_DOTNET=$(command -v dotnet)
          WRAPPER_DIR=$(mktemp -d)
          cat > "${WRAPPER_DIR}/dotnet" <<EOF
        #!/bin/sh
        if [ "\$1" = "sonarscanner" ] && [ "\$2" = "begin" ]; then
          shift 2
          n=\$#
          i=0
          while [ "\$i" -lt "\$n" ]; do
            arg="\$1"
            shift
            case "\$arg" in
              /d:sonar.host.url=*)
                if [ -z "${SONAR_REGION}" ]; then
                  set -- "\$@" "\$arg"
                fi
                ;;
              *) set -- "\$@" "\$arg" ;;
            esac
            i=\$((i + 1))
          done
          if [ -n "${SONAR_REGION}" ]; then
            set -- "/d:sonar.region=${SONAR_REGION}" "\$@"
          fi
          exec ${REAL_DOTNET} sonarscanner begin "/o:${SONAR_ORG}" "\$@"
        fi
        exec ${REAL_DOTNET} "\$@"
        EOF
          chmod +x "${WRAPPER_DIR}/dotnet"
          export PATH="${WRAPPER_DIR}:$PATH"
        fi

        $(params.EXTRA_COMMANDS)
{{- include "resources" . | nindent 6 }}
{{ end }}
