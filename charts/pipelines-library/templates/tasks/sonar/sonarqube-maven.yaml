{{ if .Values.pipelines.deployableResources.tasks }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sonarqube-maven
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Security
    tekton.dev/tags: security
    tekton.dev/displayName: "sonarqube scanner"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    The sonarqube-scanner Task will update parameters in the
    sonar-project.properties file or create a new sonar-project.properties
    file and put parameters of a sonar project into it.

    Task will run sonar-scanner for scanning after preparing the sonar-project.properties file.

  workspaces:
    - name: source
  volumes:
    - name: settings-maven
      configMap:
        name: {{ .Values.tekton.configs.mavenConfigMap }}
  params:
    - name: SONAR_PROJECT_KEY
      description: Project's unique key
      default: ""
    - name: SONAR_PROJECT_NAME
      description: Project's unique name
      default: ""
    - name: SONAR_QUALITYGATE_WAIT
      description: Forces the analysis step to poll the SonarQube instance and wait for the Quality Gate status.
      default: "true"
    - name: ci-nexus
      type: string
      description: name of the secret holding the Nexus CI integration data
      default: ci-nexus
    - name: ci-sonarqube
      type: string
      description: name of the secret holding the Sonarqube CI integration data
      default: "ci-sonarqube"
    - name: branch
      type: string
      description: Branch of scanning (for build pipeline)
      default: ""
    - name: target-branch
      type: string
      description: Target branch of Merge Request
      default: ""
    - name: source-branch
      type: string
      description: Source branch of Merge Request
      default: ""
    - name: key-id
      type: string
      description: Change number from Merge Request
      default: ""
    - name: CONTEXT_DIR
      type: string
      description: >-
        The context directory within the repository for sources on
        which we want to execute maven goals.
      default: "source"
    - name: MAVEN_IMAGE
      type: string
      description: Maven base image
      default: {{ include "edp-tekton.registry" . }}/maven:3.9.16-eclipse-temurin-11
    - name: EXTRA_COMMANDS
      description: maven goals to run
      type: array
      default:
        - "package"
    - name: step_prepare_project_image
      type: string
      default: "{{ include "edp-tekton.registry" . }}/epamedp/tekton-autotest:0.1.8"
  steps:
    - image: $(params.step_prepare_project_image)
      name: prepare-project
      workingDir: $(workspaces.source.path)
      env:
{{- include "edp-tekton.sonar.secretEnv" . | nindent 8 }}
        - name: SONAR_PROJECT_KEY
          value: "$(params.SONAR_PROJECT_KEY)"
        - name: SONAR_PROJECT_NAME
          value: "$(params.SONAR_PROJECT_NAME)"
      script: |
        {{ include "edp-tekton.sonar.prepareProject" . | nindent 8 }}
    - name: mvn-goals
      image: $(params.MAVEN_IMAGE)
      volumeMounts:
        - name: settings-maven
          mountPath: /var/configmap
      workingDir: $(workspaces.source.path)/$(params.CONTEXT_DIR)
      command: ["/bin/sh", "-c"]
      args:
        - |
{{ include "edp-tekton.sonar.resolve" . | nindent 10 }}

          # In SonarCloud mode the project key and the organization come from the project's pom.xml.
          # The command line wins over pom.xml, so the codebase name the pipeline passes as
          # -Dsonar.projectKey is dropped. In the US region the scanner gets sonar.region and no host
          # URL: not as an option, not from the environment, and not from the "sonar" profile of the
          # Maven settings, which sets sonar.host.url (the scanner rejects it together with the region).
          if [ "${SONAR_MODE}" = "sonarcloud" ]; then
            for key in sonar.projectKey sonar.organization; do
              grep -qs "${key}" pom.xml || echo "WARNING: ${key} is not found in pom.xml. SonarCloud needs it (it can also come from a parent POM or a -D option)."
            done
            n=$#
            i=0
            while [ "$i" -lt "$n" ]; do
              arg="$1"
              shift
              case "$arg" in
                -Dsonar.projectKey=*) ;;
                -Dsonar.host.url=*) [ -n "${SONAR_REGION}" ] || set -- "$@" "$arg" ;;
                *) set -- "$@" "$arg" ;;
              esac
              i=$((i + 1))
            done
            if [ -n "${SONAR_REGION}" ]; then
              unset SONAR_HOST_URL
              MAVEN_SETTINGS=$(mktemp)
              sed '/<sonar.host.url>/,/<\/sonar.host.url>/d' /var/configmap/settings.xml > "${MAVEN_SETTINGS}"
              set -- "$@" "-Dsonar.region=${SONAR_REGION}"
            fi
          fi
          exec /usr/bin/mvn -s "${MAVEN_SETTINGS:-/var/configmap/settings.xml}" "$@"
        - "--"
        - $(params.EXTRA_COMMANDS[*])
      env:
        - name: HOME
          value: $(workspaces.source.path)
{{- include "edp-tekton.sonar.secretEnv" . | nindent 8 }}
        - name: SONAR_PROJECT_KEY
          value: "$(params.SONAR_PROJECT_KEY)"
        - name: CI_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.ci-nexus)
              key: username
        - name: CI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.ci-nexus)
              key: password
{{- include "resources" . | nindent 6 }}
{{ end }}
