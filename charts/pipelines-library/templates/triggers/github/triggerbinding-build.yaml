{{ if has "github" .Values.global.gitProviders }}
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-binding-build
  labels:
    {{- include "edp-tekton.labels" . | nindent 4 }}
spec:
  params:
    - name: gitrevision
      value: "$(body.pull_request.base.ref)"
    - name: gitbranch
      value: "$(body.pull_request.head.ref)"
    - name: targetBranch
      value: "$(body.pull_request.base.ref)"
    - name: gitrepositoryurl
      value: "$(body.repository.ssh_url)"
    - name: gitrepositoryname
      value: "$(body.repository.name)"
    - name: gitsha
      value: $(extensions.pullRequest.headSha)
    - name: gitfullrepositoryname
      value: $(body.repository.full_name)
    - name: codebase
      value: "$(extensions.codebase)"
    - name: codebasebranch
      value: "$(extensions.codebasebranch)"
    - name: changeNumber
      value: "$(extensions.pullRequest.changeNumber)"
    # commitMessage is used for the 'commit-validate' Task
    - name: commitMessage
      value: "$(body.pull_request.title)"
    # commitMessagePattern is used for 'commit-validate' Tasks
    - name: commitMessagePattern
      value: "$(extensions.spec.commitMessagePattern)"
    # get the pipeline name from the codebasebranch spec
    - name: pipelineName
      value: $(extensions.pipelines.build)
    - name: gitauthor
      value: "$(extensions.pullRequest.author)"
    - name: gitavatar
      value: "$(extensions.pullRequest.authorAvatarUrl)"
    - name: gitchangeurl
      value: "$(extensions.pullRequest.url)"
    - name: serviceAccount
      value: "$(extensions.serviceAccounts.build)"
{{ end }}
